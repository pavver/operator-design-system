<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="96" height="96" role="img" aria-label="Operator UI">
  <!-- Operator UI logo, still mark. Colours follow the operator theme tokens and switch with prefers-color-scheme. -->
  <style>
    :root { --fg: #424242; --dim: #A0A0A0; --ac: #A35C00; --am: #D9B98A; --bd: #767676; }
    @media (prefers-color-scheme: dark) { :root { --fg: #C5C5C5; --dim: #5A5A5A; --ac: #F0A53A; --am: #8A6630; --bd: #6E6E6E; } }
    .ac { fill: var(--ac); } .fg { fill: var(--fg); } .am { fill: var(--am); } .dim { fill: var(--dim); }
    .btn { fill: none; stroke: var(--bd); stroke-width: 0.75; }
    .br { fill: none; stroke: var(--fg); stroke-width: 1.5; }
  </style>
  <rect class="ac" x="4.5" y="5" width="15" height="4"/>
  <rect class="fg" x="4.5" y="10" width="11" height="4"/>
  <rect class="am" x="16.5" y="10" width="3" height="4"/>
  <rect class="dim" x="4.5" y="15" width="7" height="4"/>
  <rect class="btn" x="12.875" y="15.375" width="6.25" height="3.25"/>
  <rect class="fg" x="14.5" y="16.5" width="3" height="1"/>
  <path class="br" d="M5.5 3H2.5v18h3"/>
  <path class="br" d="M18.5 3h3v18h-3"/>
</svg>

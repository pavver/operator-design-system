[workspace]
resolver = "3"
members = [
    "tools/operator-tokens",
    "crates/operator-ui-tokens",
    "web/operator-ui",
    "web/operator-ui-demo",
]

[workspace.package]
edition = "2024"
version = "0.3.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pavver/operator-design-system"

[workspace.dependencies]
operator-ui-tokens = { path = "crates/operator-ui-tokens" }
operator-ui = { path = "web/operator-ui" }
leptos = { version = "0.8.22", features = ["csr"] }
wasm-bindgen = "0.2.130"
web-sys = "0.3.107"
js-sys = "0.3.107"

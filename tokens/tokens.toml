# Operator UI design tokens.
# This file is the single source of truth for every platform.
# Regenerate platform sources with `cargo run -p operator-tokens` from the repository root.
#
# Units:
#   dimensions.*  -> Design Units (DU), 1 DU = 4 logical points, never scales with text.
#   typography.*  -> Type Units (TU), 1 TU = 1 scalable logical point.
#   motion.*      -> milliseconds.
#   colors        -> "#RRGGBB" or "#RRGGBBAA".

[units]
du_points = 4.0
tu_points = 1.0

[font]
family = "Cascadia Code"
fallback = ["Cascadia Mono", "ui-monospace", "monospace"]

# ---------------------------------------------------------------------------
# Spatial tokens (DU)
# ---------------------------------------------------------------------------
[dimensions]
border = 0.25
border_thick = 0.5
spinner_stroke = 0.375
gap_micro = 0.5
pad_tight = 1.0
pad_small = 1.5
gutter = 2.0
pad_content = 2.5
pad_card = 3.0
margin_screen = 4.0
section_gap = 6.0

icon_small = 4.0
icon_medium = 4.5
icon_large = 6.0

row_dense = 6.0
row_compact = 8.0
row_standard = 10.0
row_control = 12.0
row_two_line = 13.0
row_avatar = 14.0

avatar_small = 6.0
avatar_default = 8.0
avatar_header = 10.0

bubble_min_width = 30.0
bubble_max_width = 105.0

# ---------------------------------------------------------------------------
# Typography (TU)
# ---------------------------------------------------------------------------
[typography.app_title]
size = 20
line = 26
weight = 700

[typography.screen_title]
size = 18
line = 24
weight = 500

[typography.section_title]
size = 14
line = 18
weight = 500

[typography.row_title]
size = 15
line = 20
weight = 500

[typography.body]
size = 14
line = 18
weight = 400

[typography.body_small]
size = 13
line = 16
weight = 400

[typography.caption]
size = 12
line = 15
weight = 400

[typography.console]
size = 12
line = 16
weight = 400

# ---------------------------------------------------------------------------
# Motion (ms)
# ---------------------------------------------------------------------------
[motion]
state_color = 150
result_fade = 500
result_pulse_half = 400
result_hold = 800
local_flash_icon = 500
local_flash_tail = 300
pending_lap = 2000
spinner_lap = 900
segment_slide = 150
dialog_enter = 150
tooltip_hide_delay = 800
alarm_flash_half = 250
tooltip_show_delay = 500
long_press = 500
toast_duration = 4000
toast_error_duration = 8000
sheet_slide = 200
expand = 200
skeleton_lap = 1500
search_debounce = 300
overscroll_release = 300

# ---------------------------------------------------------------------------
# Themes
# Each theme defines `dark` and `light` palettes with an identical key set.
# ---------------------------------------------------------------------------


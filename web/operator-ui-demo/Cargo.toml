[package]
name = "operator-ui-demo"
description = "Interactive gallery of Operator UI web components."
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
operator-ui = { workspace = true, features = ["full"] }
leptos.workspace = true
js-sys.workspace = true
console_error_panic_hook = "0.1.7"
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = ["Window", "Location", "Element", "HtmlElement", "ScrollIntoViewOptions", "ScrollBehavior", "ScrollLogicalPosition"] }

[build-dependencies]
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

[package]
name = "operator-ui"
description = "Operator UI core component library for Leptos."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
operator-ui-tokens.workspace = true
leptos.workspace = true
wasm-bindgen.workspace = true
js-sys.workspace = true
wasm-bindgen-futures.workspace = true
send_wrapper = "0.6"
gloo-timers = { version = "0.4.0", features = ["futures"] }
web-sys = { workspace = true, features = ["HtmlElement", "HtmlInputElement", "DomRect", "Element", "EventTarget", "PointerEvent", "KeyboardEvent", "CssStyleDeclaration", "Window", "Document", "Node", "ResizeObserver", "Navigator", "Clipboard", "NodeList", "HtmlTextAreaElement", "WheelEvent", "TouchEvent", "TouchList", "Touch", "MediaQueryList", "MutationObserver", "MutationObserverInit", "HtmlCollection", "HtmlDocument"] }
arborium = { version = "2.18.2", optional = true, default-features = false }

[features]
default = ["reviewed"]

# Group features
reviewed = [
    "accordion",
    "action-button",
    "avatar",
    "banner",
    "checkbox",
    "checkbox-group",
    "chip",
    "code-block",
    "confirm-dialog",
    "console-terminal",
    "counter",
    "dialog",
    "empty-state",
    "header",
    "icon-button",
    "kbd",
    "linear-progress",
    "list-item",
    "pagination",
    "primitives",
    "radio-group",
    "scroll-area",
    "scrollbar",
    "search-field",
    "segmented-control",
    "sheet",
    "skeleton",
    "slider",
    "split-pane",
    "status-badge",
    "stepper",
    "switch",
    "tabs",
    "text-area",
    "theme-toggle",
    "toast",
]

draft = [
    "editor",
    "fab",
    "file-field",
    "form",
    "knob",
    "popup-edit",
    "range-slider",
    "rating",
    "split-button",
    "uploader",
    "field",
    "text-field",
    "navigation-rail",
    "side-panel",
    "tree",
    "color-field",
    "date-time-field",
    "duration-field",
    "number-field",
    "time-field",
    "hover-card",
    "marquee-text",
    "menu",
    "tooltip",
    "popover",
    "combobox",
    "dropdown-menu",
    "data-table",
    "property-list",
    "toolbar",
    "virtual-list",
]

full = ["reviewed", "draft"]

# Project-specific components (node-graph editing, code fields): not part of `full`.
extensions = ["code-field", "graph"]

# Component features
editor = ["field", "primitives", "web-sys/Selection", "web-sys/Range", "web-sys/ClipboardEvent", "web-sys/DataTransfer", "web-sys/DomParser", "web-sys/SupportedType"]
fab = ["action-button", "popover"]
field = ["primitives"]
accordion = ["primitives"]
action-button = ["primitives"]
arborium = ["code-block", "dep:arborium"]
avatar = ["primitives", "status-badge"]
banner = ["primitives", "toast"]
checkbox = ["primitives"]
checkbox-group = ["primitives"]
chip = ["primitives"]
code-block = ["icon-button", "scrollbar"]
code-field = ["combobox", "field", "hover-card", "popover", "virtual-list"]
color-field = ["field", "popover", "primitives"]
combobox = ["dropdown-menu", "field", "popover", "primitives", "scrollbar", "virtual-list"]
confirm-dialog = ["dialog"]
console-terminal = ["scrollbar"]
counter = []
data-table = ["linear-progress", "primitives", "scrollbar"]
dialog = ["action-button", "icon-button", "scrollbar"]
date-time-field = ["field", "popover", "primitives"]
duration-field = ["field"]
dropdown-menu = ["field", "popover", "primitives", "scrollbar", "virtual-list"]
empty-state = ["primitives"]
file-field = ["field", "chip", "primitives", "web-sys/File", "web-sys/Blob", "web-sys/FileList", "web-sys/DragEvent", "web-sys/DataTransfer"]
form = ["primitives", "web-sys/FocusEvent"]
header = ["avatar", "primitives", "status-badge"]
graph = ["hover-card", "primitives"]
hover-card = ["popover"]
icon-button = ["primitives", "tooltip"]
kbd = []
knob = ["primitives"]
linear-progress = []
list-item = []
marquee-text = ["tooltip"]
menu = ["icon-button", "popover", "primitives", "scrollbar"]
navigation-rail = ["primitives"]
number-field = ["field"]
pagination = ["icon-button"]
popover = []
popup-edit = ["action-button", "popover", "text-field"]
primitives = []
property-list = ["icon-button"]
radio-group = ["checkbox-group", "primitives"]
range-slider = ["slider", "primitives"]
rating = ["primitives"]
scroll-area = ["scrollbar"]
scrollbar = []
search-field = ["field", "primitives"]
segmented-control = ["primitives"]
sheet = ["icon-button", "scrollbar"]
side-panel = ["icon-button"]
skeleton = []
slider = ["primitives"]
split-button = ["action-button", "menu", "primitives"]
split-pane = ["scrollbar"]
status-badge = ["primitives"]
stepper = ["primitives"]
switch = ["primitives"]
tabs = ["primitives"]
text-area = ["field", "scrollbar", "tooltip"]
text-field = ["action-button", "field", "primitives"]
theme-toggle = []
toast = ["primitives"]
toolbar = ["icon-button", "menu", "tooltip"]
time-field = ["field"]
tree = ["primitives", "virtual-list"]
tooltip = ["popover"]
uploader = ["action-button", "file-field", "linear-progress", "primitives"]
virtual-list = ["scrollbar"]


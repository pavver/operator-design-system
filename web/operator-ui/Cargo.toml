[package]
name = "operator-ui"
description = "Operator UI core component library for Leptos."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
operator-ui-tokens.workspace = true
leptos.workspace = true
wasm-bindgen.workspace = true
js-sys.workspace = true
wasm-bindgen-futures.workspace = true
send_wrapper = "0.6"
gloo-timers = { version = "0.4.0", features = ["futures"] }
web-sys = { workspace = true, features = ["HtmlElement", "HtmlInputElement", "DomRect", "Element", "EventTarget", "PointerEvent", "KeyboardEvent", "CssStyleDeclaration", "Window", "Document", "Node", "ResizeObserver", "Navigator", "Clipboard", "NodeList", "HtmlTextAreaElement", "WheelEvent", "TouchEvent", "TouchList", "Touch", "MediaQueryList", "MutationObserver", "MutationObserverInit", "HtmlCollection", "HtmlDocument"] }
arborium = { version = "2.18.2", optional = true, default-features = false }

[features]
default = ["reviewed"]

# Group features
reviewed = [
    "accordion",
    "action-button",
    "action-stack",
    "avatar",
    "banner",
    "button-group",
    "checkbox",
    "checkbox-group",
    "chip",
    "code-block",
    "confirm-dialog",
    "console-terminal",
    "counter",
    "dialog",
    "empty-state",
    "header",
    "icon-button",
    "kbd",
    "language-picker",
    "launcher-tile",
    "linear-progress",
    "list-item",
    "menu",
    "pagination",
    "primitives",
    "radio-group",
    "scroll-area",
    "scrollbar",
    "search-field",
    "segmented-control",
    "sheet",
    "skeleton",
    "slider",
    "split-button",
    "split-pane",
    "status-badge",
    "stepper",
    "switch",
    "tabs",
    "text-area",
    "theme-toggle",
    "toast",
]

draft = [
    "aspect-ratio",
    "breadcrumbs",
    "carousel",
    "circular-progress",
    "color-field",
    "combobox",
    "data-table",
    "date-range-field",
    "date-time-field",
    "dropdown-menu",
    "duration-field",
    "editor",
    "field",
    "file-field",
    "form",
    "hover-card",
    "image",
    "infinite-scroll",
    "knob",
    "layout",
    "loading-bar",
    "loading-overlay",
    "marquee-text",
    "navigation-rail",
    "number-field",
    "observers",
    "parallax",
    "popover",
    "popup-edit",
    "property-list",
    "pull-to-refresh",
    "range-slider",
    "rating",
    "side-panel",
    "space",
    "swipe-item",
    "tab-panels",
    "text-field",
    "time-field",
    "timeline",
    "toolbar",
    "tooltip",
    "tree",
    "uploader",
    "video",
    "virtual-list",
    "wizard",
]

full = ["reviewed", "draft"]

# Project-specific components (node-graph editing, code fields, media suite): not part of `full`.
extensions = ["code-field", "graph", "media"]

# Media extension components
media = [
    "chat-input",
    "chat-message",
    "emoji-picker",
    "gallery",
    "gallery-viewer",
    "gif-picker",
    "media-keyboard",
    "media-record-button",
    "ptt-button",
    "ptz-pad",
    "reaction-picker",
    "sticker-picker",
    "video-stream",
]

# Component features
editor = ["action-button", "field", "icon-button", "primitives", "text-field", "tooltip", "web-sys/Selection", "web-sys/Range", "web-sys/ClipboardEvent", "web-sys/DataTransfer", "web-sys/DomParser", "web-sys/SupportedType"]
action-stack = ["action-button", "icon-button", "popover", "scrollbar"]
field = ["primitives"]
accordion = ["primitives"]
action-button = ["primitives"]
arborium = ["code-block", "dep:arborium"]
aspect-ratio = []
avatar = ["primitives", "status-badge"]
banner = ["primitives", "toast"]
breadcrumbs = ["icon-button", "menu", "primitives"]
button-group = []
carousel = ["icon-button", "primitives"]
chat-input = ["chat-message", "media-record-button", "primitives"]
chat-message = ["primitives"]
checkbox = ["primitives"]
checkbox-group = ["primitives"]
chip = ["primitives"]
circular-progress = []
code-block = ["icon-button", "scrollbar"]
code-field = ["combobox", "field", "hover-card", "popover", "virtual-list"]
color-field = ["field", "popover", "primitives"]
combobox = ["dropdown-menu", "field", "popover", "primitives", "scrollbar", "virtual-list"]
confirm-dialog = ["dialog"]
console-terminal = ["scrollbar"]
counter = []
data-table = ["linear-progress", "primitives", "scrollbar"]
dialog = ["action-button", "icon-button", "scrollbar"]
date-range-field = ["field", "popover", "primitives"]
date-time-field = ["field", "popover", "primitives"]
duration-field = ["field", "popover", "primitives"]
dropdown-menu = ["field", "popover", "primitives", "scrollbar", "virtual-list"]
empty-state = ["primitives"]
emoji-picker = ["chat-message", "primitives"]
file-field = ["field", "chip", "primitives", "web-sys/File", "web-sys/Blob", "web-sys/FileList", "web-sys/DragEvent", "web-sys/DataTransfer"]
form = ["action-button", "primitives", "web-sys/FocusEvent"]
gallery = ["aspect-ratio", "checkbox", "gallery-viewer", "image", "primitives", "web-sys/IntersectionObserver", "web-sys/IntersectionObserverEntry", "web-sys/IntersectionObserverInit"]
gallery-viewer = ["icon-button", "primitives", "web-sys/HtmlVideoElement"]
gif-picker = ["primitives", "web-sys/HtmlVideoElement", "web-sys/IntersectionObserver", "web-sys/IntersectionObserverEntry", "web-sys/IntersectionObserverInit"]
header = ["avatar", "primitives", "status-badge"]
graph = ["hover-card", "primitives"]
hover-card = ["popover"]
icon-button = ["primitives", "tooltip"]
image = ["primitives", "skeleton"]
infinite-scroll = ["action-button", "observers", "primitives"]
kbd = []
knob = ["primitives"]
language-picker = ["combobox"]
launcher-tile = ["primitives"]
layout = ["icon-button", "observers"]
linear-progress = []
list-item = []
loading-bar = []
loading-overlay = ["primitives"]
marquee-text = ["tooltip"]
media-keyboard = ["chat-message", "emoji-picker", "gif-picker", "popover", "primitives", "sticker-picker"]
media-record-button = ["primitives"]
menu = ["icon-button", "popover", "primitives", "scrollbar"]
navigation-rail = ["primitives"]
number-field = ["field"]
observers = ["web-sys/IntersectionObserver", "web-sys/IntersectionObserverEntry", "web-sys/IntersectionObserverInit", "web-sys/ResizeObserverEntry"]
pagination = ["icon-button"]
parallax = ["observers"]
popover = []
popup-edit = ["action-button", "popover", "text-field"]
primitives = []
property-list = ["icon-button"]
pull-to-refresh = ["primitives"]
ptt-button = ["primitives"]
ptz-pad = ["icon-button", "primitives"]
radio-group = ["checkbox-group", "primitives"]
range-slider = ["slider", "primitives"]
rating = ["primitives"]
reaction-picker = ["primitives"]
scroll-area = ["scrollbar"]
scrollbar = []
search-field = ["field", "primitives"]
segmented-control = ["primitives"]
sheet = ["icon-button", "scrollbar"]
side-panel = ["icon-button"]
skeleton = []
slider = ["primitives"]
space = []
split-button = ["action-button", "action-stack"]
split-pane = ["scrollbar"]
status-badge = ["primitives"]
stepper = ["primitives"]
sticker-picker = ["chat-message", "primitives"]
swipe-item = ["primitives"]
switch = ["primitives"]
tab-panels = ["primitives"]
tabs = ["primitives"]
text-area = ["field", "scrollbar", "tooltip"]
text-field = ["action-button", "field", "primitives"]
theme-toggle = []
toast = ["primitives"]
toolbar = ["icon-button", "menu", "tooltip"]
time-field = ["field", "popover", "primitives"]
timeline = ["primitives"]
tree = ["primitives", "virtual-list"]
tooltip = ["popover"]
video = ["primitives"]
video-stream = ["action-button", "aspect-ratio", "icon-button", "primitives", "web-sys/HtmlVideoElement", "web-sys/MediaStream"]
uploader = ["action-button", "file-field", "linear-progress", "primitives"]
virtual-list = ["scrollbar"]
wizard = ["action-button", "icon-button", "primitives"]


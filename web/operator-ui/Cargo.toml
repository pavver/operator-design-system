[package]
name = "operator-ui"
description = "Operator UI core component library for Leptos."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
operator-ui-tokens.workspace = true
leptos.workspace = true
wasm-bindgen.workspace = true
js-sys.workspace = true
wasm-bindgen-futures.workspace = true
send_wrapper = "0.6"
gloo-timers = { version = "0.4.0", features = ["futures"] }
web-sys = { workspace = true, features = ["HtmlElement", "HtmlInputElement", "DomRect", "Element", "EventTarget", "PointerEvent", "KeyboardEvent", "CssStyleDeclaration", "Window", "Document", "Node", "ResizeObserver", "Navigator", "Clipboard", "NodeList", "HtmlTextAreaElement", "WheelEvent", "TouchEvent", "TouchList", "Touch", "MediaQueryList", "MutationObserver", "MutationObserverInit", "HtmlCollection"] }
arborium = { version = "2.18.2", optional = true, default-features = false }

[features]
default = ["reviewed"]

# Group features
reviewed = [
    "accordion",
    "action-button",
    "avatar",
    "banner",
    "checkbox",
    "checkbox-group",
    "chip",
    "code-block",
    "combobox",
    "confirm-dialog",
    "console-terminal",
    "counter",
    "dialog",
    "dropdown-menu",
    "empty-state",
    "header",
    "icon-button",
    "kbd",
    "linear-progress",
    "list-item",
    "marquee-text",
    "menu",
    "pagination",
    "primitives",
    "radio-group",
    "scroll-area",
    "scrollbar",
    "search-field",
    "segmented-control",
    "sheet",
    "skeleton",
    "slider",
    "split-pane",
    "status-badge",
    "stepper",
    "switch",
    "tabs",
    "text-area",
    "text-field",
    "theme-toggle",
    "toast",
    "tooltip",
]

draft = [
    "data-table",
    "property-list",
    "toolbar",
]

full = ["reviewed", "draft"]

# Component features
accordion = ["primitives"]
action-button = ["primitives"]
arborium = ["code-block", "dep:arborium"]
avatar = ["primitives", "status-badge"]
banner = ["primitives", "toast"]
checkbox = ["primitives"]
checkbox-group = ["primitives"]
chip = ["primitives"]
code-block = ["icon-button", "scrollbar"]
combobox = ["primitives", "scrollbar"]
confirm-dialog = ["dialog"]
console-terminal = ["scrollbar"]
counter = []
data-table = ["linear-progress", "primitives", "scrollbar"]
dialog = ["action-button", "icon-button", "scrollbar"]
dropdown-menu = ["primitives", "scrollbar"]
empty-state = ["primitives"]
header = ["avatar", "primitives", "status-badge"]
icon-button = ["primitives", "tooltip"]
kbd = []
linear-progress = []
list-item = []
marquee-text = ["tooltip"]
menu = ["icon-button", "primitives", "scrollbar"]
pagination = ["icon-button"]
primitives = []
property-list = ["icon-button"]
radio-group = ["checkbox-group", "primitives"]
scroll-area = ["scrollbar"]
scrollbar = []
search-field = ["primitives"]
segmented-control = ["primitives"]
sheet = ["icon-button", "scrollbar"]
skeleton = []
slider = ["primitives"]
split-pane = ["scrollbar"]
status-badge = ["primitives"]
stepper = ["primitives"]
switch = ["primitives"]
tabs = ["primitives"]
text-area = ["scrollbar", "tooltip"]
text-field = ["action-button", "primitives"]
theme-toggle = []
toast = ["primitives"]
toolbar = []
tooltip = []


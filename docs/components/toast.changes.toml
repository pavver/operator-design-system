en = "Customization hooks: `class`/`style`, metric props (`shift`, `viewport_margin`, `gap`, `width`, `min_height`, `padding_y`, `padding_start`, `shadow_blur`, `label_font_size`, `label_line_height`, `text_padding_end`, `button_size`, `font_size`, `line_height`, `icon_size`, `close_icon_size`, `letter_spacing`, `padding_end`, `shadow_y`), `--op-toast-*` metric and color variables, slots (`header`, `actions`, `footer`), translatable strings and replaceable icons. Added the public Toast visual; ToastHost forwards the same appearance hooks."

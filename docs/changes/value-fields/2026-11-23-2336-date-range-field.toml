[en]
summary = "New DateRangeField for ranges such as `12 Jul – 5 Nov 2026`: quick ranges (today, this week, last month, last 7 days…), two linked months with a hover preview, and text input in day-month or ISO forms. Calendar gains `range`, `on_hover`, `month`, `hide_previous` and `hide_next`."

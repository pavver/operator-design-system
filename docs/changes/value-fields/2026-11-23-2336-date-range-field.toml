[uk]
summary = "Новий DateRangeField для діапазонів на кшталт `12 лип – 5 лис 2026`: швидкий вибір (сьогодні, цей тиждень, минулий місяць, останні 7 днів…), два пов'язані місяці з попереднім переглядом під вказівником і текстове введення у формах «день місяць» або ISO. Calendar отримав `range`, `on_hover`, `month`, `hide_previous` і `hide_next`."
check = "Відкрийте обидва демонстраційні поля діапазону, виберіть два дні в будь-якому порядку й через два місяці, стежте за попереднім переглядом, виберіть швидкі діапазони, введіть `3 – 10 Aug 2026`, `20 грудня – 3 січня 2027` і некоректну дату, очистіть необов'язкове поле."

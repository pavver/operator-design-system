[en]
summary = "ColorPicker adds a screen colour picker button where the browser offers the EyeDropper API; the `colorize` icon joins the icon set."
check = "In Chromium, press the button next to the colour code, pick a colour on the screen, and check that the value and opacity are right; in Firefox the button is absent."


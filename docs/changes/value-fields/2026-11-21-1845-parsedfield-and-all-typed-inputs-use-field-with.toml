[en]
summary = "ParsedField and all typed inputs use Field with class/style, label/hint/error/variant, height, padding_x, slot_size, gap, font_size and slots prepend, append, before, after, label_slot and hint_slot; NumberField adds unit_padding_x/unit_gap, pickers add icon_size and popup_shadow_y/popup_shadow_blur, ColorField adds preview_size, picker_gap, picker_padding_x, popup_gap, popup_padding, swatch_size, custom_height and custom_padding_x; DateTimeField adds calendar_padding, calendar_cell_size, calendar_header_height and calendar_weekday_height; Calendar adds padding, cell_size, header_height, weekday_height, icon_size, font_size, caption_font_size, line_height, caption_line_height and header/footer, translated month/weekday names and navigation icons; DurationField adds translatable day_unit/hour_unit/minute_unit/second_unit/millisecond_unit with round-trip parsing; field color variables, translated picker labels and replaceable picker icons."

[uk]
summary = "ParsedField та всі типізовані поля використовують Field із class/style, label/hint/error/variant, height, padding_x, slot_size, gap, font_size і слотами prepend, append, before, after, label_slot та hint_slot; NumberField додає unit_padding_x/unit_gap, засоби вибору — icon_size та popup_shadow_y/popup_shadow_blur, ColorField — preview_size, picker_gap, picker_padding_x, popup_gap, popup_padding, swatch_size, custom_height і custom_padding_x; DateTimeField додає calendar_padding, calendar_cell_size, calendar_header_height і calendar_weekday_height; Calendar додає padding, cell_size, header_height, weekday_height, icon_size, font_size, caption_font_size, line_height, caption_line_height і header/footer, перекладні назви місяців і днів тижня та іконки навігації; DurationField додає перекладні day_unit/hour_unit/minute_unit/second_unit/millisecond_unit зі зворотним розбором; змінні кольорів поля, перекладні підписи засобів вибору та замінні іконки."

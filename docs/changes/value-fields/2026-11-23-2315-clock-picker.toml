check = "Відкрийте циферблат обох демонстраційних TimeField, перетягніть стрілку внутрішнім і зовнішнім колом, перемкніть AM/PM, покрокуйте стрілками та клавішами Page і перевірте, що відпускання хвилини закриває вікно."

[en]
summary = "Icon sizes now use the icon tokens (`icon_xsmall` 3.5, `icon_small` 4, `icon_medium` 4.5, `icon_field` 5, `icon_large` 6, `icon_xlarge` 8, `icon_display` 12 DU) instead of raw numbers, and the specification names each token with its value. The header gets `gutter` (`2 DU`) vertical padding, bold text and a new `header_padding_y` metric (`--op-menu-header-padding-y`)."
check = "Open the Customization example and check the header spacing."

[uk]
summary = "Розміри піктограм тепер задаються токенами (`icon_xsmall` 3.5, `icon_small` 4, `icon_medium` 4.5, `icon_field` 5, `icon_large` 6, `icon_xlarge` 8, `icon_display` 12 DU) замість сирих чисел, а специфікація називає кожен токен разом зі значенням. Заголовок отримує відступи `gutter` (`2 DU`) зверху й знизу, жирний текст і нову метрику `header_padding_y` (`--op-menu-header-padding-y`)."
check = "Відкрийте приклад кастомізації й перевірте відступи заголовка."

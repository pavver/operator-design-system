[en]
summary = "A focused clickable row shows a ring inside it with the `hover` background instead of an outer ring over its neighbours; new `--op-list-item-focus` variable. Lists, menus, stacks and tables now share one focus look from States: a `0.5 DU` `accent` ring inside the item and the `hover` background while it is at rest."

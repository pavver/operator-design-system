[en]
summary = "A focused option shows a ring inside it and, unless selected, the `hover` background; the outer ring was clipped by the list. Lists, menus, stacks and tables now share one focus look from States: a `0.5 DU` `accent` ring inside the item and the `hover` background while it is at rest."
check = "Open a dropdown and move to an option with Tab; check an unselected and the selected option."


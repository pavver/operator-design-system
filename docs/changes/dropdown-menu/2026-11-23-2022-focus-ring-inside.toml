summary = "Варіант у фокусі показує рамку всередині й, якщо не вибраний, тло `hover`; зовнішню рамку обрізав список. Списки, меню, стоси й таблиці тепер мають однаковий вигляд фокуса зі Станів: рамку `0.5 DU` у кольорі `accent` усередині пункту й тло `hover` у стані спокою."
check = "Відкрийте список і перейдіть до варіанта клавішею Tab; перевірте невибраний і вибраний варіанти."
